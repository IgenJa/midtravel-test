name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  http-smoke:
    name: HTTP smoke (build + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: midtravel
          POSTGRES_PASSWORD: midtravel
          POSTGRES_DB: midtravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U midtravel -d midtravel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://midtravel:midtravel@localhost:5432/midtravel?schema=public
      DIRECT_URL: postgresql://midtravel:midtravel@localhost:5432/midtravel?schema=public
      BETTER_AUTH_SECRET: ci-better-auth-secret-must-be-32-chars
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMeNow!23
      SEED_ADMIN_NAME: CI Admin
      SMOKE_BASE_URL: http://127.0.0.1:3000
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrate + seed
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Build
        run: npm run build

      - name: Start app and HTTP smoke
        run: |
          npm run start &
          npm run smoke:http
