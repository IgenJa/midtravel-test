# Shared security headers. Include from HTTPS server / location blocks:
#   include snippets/midtravel-security-headers.conf;
#
# Keep this CSP in sync with src/lib/security-headers.ts (production policy).
# `always` so 3xx/4xx (www→apex, errors) also get the headers.
# Re-include this file in any location that has its own add_header (nginx
# does not inherit parent add_header once a location sets one).

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://*.public.blob.vercel-storage.com https://public.blob.vercel-storage.com; font-src 'self' data:; connect-src 'self' https://*.ingest.sentry.io https://*.sentry.io; frame-src 'self' https://maps.google.com https://www.google.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
