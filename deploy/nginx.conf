# nginx reverse proxy for MidTravel on a Rackhost (or any) VPS.
#
# Install:
#   sudo cp deploy/nginx-http.conf /etc/nginx/conf.d/midtravel-zones.conf
#   sudo cp deploy/nginx-security-headers.conf /etc/nginx/snippets/midtravel-security-headers.conf
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/midtravel
#   sudo ln -s /etc/nginx/sites-available/midtravel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Canonical host is the apex (midtravel.hu). www must 301 here — Better Auth
# session cookies are host-only, so serving both hosts as equals breaks login.
#
# First TLS (webroot, before the 443 blocks can start):
#   1. Comment out the two `listen 443` server blocks below
#   2. nginx -t && systemctl reload nginx
#   3. certbot certonly --webroot -w /var/www/certbot -d midtravel.hu -d www.midtravel.hu
#   4. Uncomment the 443 servers, then nginx -t && systemctl reload nginx
#
# Or let Certbot edit this file:
#   certbot --nginx -d midtravel.hu -d www.midtravel.hu

upstream midtravel_app {
  server 127.0.0.1:3000;
  keepalive 64;
}

# ── www → apex (HTTP) ────────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name www.midtravel.hu;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://midtravel.hu$request_uri;
  }
}

# ── apex HTTP → HTTPS ────────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name midtravel.hu;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://midtravel.hu$request_uri;
  }
}

# ── www → apex (HTTPS) ───────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.midtravel.hu;

  ssl_certificate     /etc/letsencrypt/live/midtravel.hu/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/midtravel.hu/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_tickets off;
  # Optional extras installed by python3-certbot-nginx:
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  include snippets/midtravel-security-headers.conf;

  return 301 https://midtravel.hu$request_uri;
}

# ── canonical HTTPS ──────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name midtravel.hu;

  ssl_certificate     /etc/letsencrypt/live/midtravel.hu/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/midtravel.hu/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_tickets off;
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  include snippets/midtravel-security-headers.conf;

  client_max_body_size 25m;
  limit_req_status 429;

  location /_next/static/ {
    proxy_pass http://midtravel_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Re-include: this location's add_header would otherwise drop the parent set.
    include snippets/midtravel-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/auth/ {
    limit_req zone=midtravel_auth burst=20 nodelay;
    proxy_pass http://midtravel_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }

  # Public Server Action POST targets (contact / apply / auth forms).
  location ~ ^/(hu|en)/(contact|apply|forgot-password|register|reset-password|login|verify-email) {
    limit_req zone=midtravel_forms burst=10 nodelay;
    proxy_pass http://midtravel_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
  }

  # Docker HEALTHCHECK / UptimeRobot — keep access logs clean.
  location = /api/health {
    proxy_pass http://midtravel_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
    access_log off;
  }

  location / {
    proxy_pass http://midtravel_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
  }
}
