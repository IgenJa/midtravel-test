# nginx reverse proxy for MidTravel on a Rackhost (or any) VPS.
# 1. Copy to /etc/nginx/sites-available/midtravel
# 2. ln -s /etc/nginx/sites-available/midtravel /etc/nginx/sites-enabled/
# 3. Replace server_name + TLS paths, then: nginx -t && systemctl reload nginx
#
# Certbot example:
#   certbot --nginx -d midtravel.hu -d www.midtravel.hu
#
# Put these in http {} context (e.g. /etc/nginx/nginx.conf) if not already present:
#   limit_req_zone $binary_remote_addr zone=midtravel_auth:10m rate=10r/s;
#   limit_req_zone $binary_remote_addr zone=midtravel_forms:10m rate=2r/s;

upstream midtravel_app {
  server 127.0.0.1:3000;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name midtravel.hu www.midtravel.hu;

  # Certbot will manage HTTPS; until then you can keep HTTP only.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name midtravel.hu www.midtravel.hu;

  # ssl_certificate     /etc/letsencrypt/live/midtravel.hu/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/midtravel.hu/privkey.pem;
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 25m;

  location /_next/static/ {
    proxy_pass http://midtravel_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Auth endpoints (login/register) — enable after adding limit_req_zone in http {}
  location /api/auth/ {
    # limit_req zone=midtravel_auth burst=20 nodelay;
    proxy_pass http://midtravel_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://midtravel_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
  }
}
