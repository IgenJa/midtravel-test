# http {} snippets for MidTravel (limit_req zones).
# Copy to /etc/nginx/conf.d/midtravel-zones.conf (that directory is included
# from the main nginx.conf http {} block on Debian/Ubuntu):
#   sudo cp deploy/nginx-http.conf /etc/nginx/conf.d/midtravel-zones.conf
#
# Auth: login/register/session (~30 app-level req/min). Burst covers Better Auth
# multi-request flows. Forms: contact / apply / password reset (5 app-level /min).

limit_req_zone $binary_remote_addr zone=midtravel_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=midtravel_forms:10m rate=2r/s;
